# ==============================================================================
# Module 6 (M6 Capstone): Project SiamShield AI — Unified Core Kubernetes Stack
# Note: CRD-dependent resources (EPP v1.0.0, GAIE v1 InferencePool, llm-d
#       InferenceObjective, KEDA ScaledObject) are separated into `siamshield-crds.yaml`
#       so `kubectl apply -f k8s/siamshield-platform.yaml` succeeds before CRDs.
# ==============================================================================
apiVersion: v1
kind: Namespace
metadata:
  name: ai-platform
---
# Cloud note: ReadWriteMany across multiple pods/nodes requires an RWX CSI driver
# (AWS EFS, GCP Filestore, CephFS). `storageClassName: standard` works on single-node
# local `kind` hostPath clusters, whereas default GCE-PD / EBS block storage is ReadWriteOnce.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hf-model-cache-pvc
  namespace: ai-platform
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: standard
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-primary
  namespace: ai-platform
  labels:
    app: vllm-serving
    role: primary
    inference-pool: vllm-qwen-pool
spec:
  replicas: 1
  # Cloud GPU note (0 spare GPUs without surge nodes): set maxSurge: 0, maxUnavailable: 1 (matches M2 values-cloud-gpu.yaml)
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: vllm-serving
      role: primary
  template:
    metadata:
      labels:
        app: vllm-serving
        role: primary
        inference-pool: vllm-qwen-pool
    spec:
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: vllm-inference
          image: mock-vllm-server:1.0.0
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: SERVER_ID
              value: "vllm-primary-svc"
            - name: MODEL_NAME
              value: "Qwen/Qwen2.5-7B-Instruct-AWQ"
            - name: HF_HOME
              value: "/cache/huggingface"
            - name: VLLM_CACHE_ROOT
              value: "/tmp/vllm-cache"
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 5"]
          startupProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8000
            periodSeconds: 5
            failureThreshold: 2
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 15
            failureThreshold: 3
          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "500m"
              memory: "128Mi"
          volumeMounts:
            - name: hf-model-cache
              mountPath: /cache/huggingface
            - name: tmp-dir
              mountPath: /tmp
      volumes:
        - name: hf-model-cache
          persistentVolumeClaim:
            claimName: hf-model-cache-pvc
        - name: tmp-dir
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: vllm-primary-svc
  namespace: ai-platform
  labels:
    app: vllm-serving
    role: primary
spec:
  selector:
    app: vllm-serving
    role: primary
  ports:
    - name: http
      port: 8000
      targetPort: 8000
---
