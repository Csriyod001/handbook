# ==============================================================================
# Local WSL2 GPU Override (`values-local-rtx4050.yaml`)
# Target Hardware: HP Victus 16-r0357tx (NVIDIA RTX 4050 6GB Ada Lovelace)
# Runs Qwen/Qwen2.5-3B-Instruct-AWQ with FP8 KV-cache & eager mode to fit 6GB VRAM.
# ==============================================================================

namespace: ai-platform
replicaCount: 1

# Helm 3 requires explicit null (not `{}`) to erase inherited keys from values.yaml.
nodeSelector: null

updateStrategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 0
    maxUnavailable: 1

image:
  repository: vllm/vllm-openai
  tag: "v0.11.0"
  pullPolicy: IfNotPresent

service:
  name: vllm-primary-svc
  type: ClusterIP
  port: 8000

model:
  id: "Qwen/Qwen2.5-3B-Instruct-AWQ"
  revision: ""
  maxModelLen: 2048
  gpuMemoryUtilization: "0.85"
  enforceEager: true
  passVllmCliArgs: true

vllmArgs:
  - "--quantization=awq_marlin"
  - "--dtype=float16"
  - "--kv-cache-dtype=fp8"
  - "--enable-prefix-caching"
  - "--max-num-batched-tokens=1024"
  - "--max-num-seqs=16"

modelCache:
  enabled: true
  createPvc: false
  pvcName: hf-model-cache-pvc
  mountPath: /cache/huggingface
  accessMode: ReadWriteOnce
  storageClassName: ""
  storageSize: 20Gi

resources:
  requests:
    cpu: "1000m"
    memory: "4Gi"
    nvidia.com/gpu: 1
  limits:
    cpu: "4000m"
    memory: "8Gi"
    nvidia.com/gpu: 1

probes:
  startup:
    path: /health
    periodSeconds: 5
    failureThreshold: 36
    timeoutSeconds: 3
  readiness:
    path: /health
    periodSeconds: 5
    failureThreshold: 2
    timeoutSeconds: 3
  liveness:
    path: /health
    periodSeconds: 15
    failureThreshold: 3
    timeoutSeconds: 5
