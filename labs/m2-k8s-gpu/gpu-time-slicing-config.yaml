# ==============================================================================
# NVIDIA Device Plugin Time-Slicing ConfigMap (Module 2)
# Applies to real GPU VMs running k3s / Kubernetes + nvidia-device-plugin.
# Splits 1 Physical GPU (e.g., NVIDIA L4 24GB) into 4 schedulable replicas.
# Note: When running 4 vLLM pods on 1 GPU, always pass `--enforce-eager` and
#       `--gpu-memory-utilization 0.20` to prevent CUDA Graph OOM!
# ==============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: nvidia-time-slicing-config
  namespace: gpu-operator
  labels:
    app.kubernetes.io/part-of: ai-infra-handbook
    app.kubernetes.io/component: gpu-time-slicing
data:
  any: |-
    version: v1
    flags:
      migStrategy: none
    sharing:
      timeSlicing:
        renameByDefault: false
        failRequestsGreaterThanOne: false
        resources:
          - name: nvidia.com/gpu
            replicas: 4
